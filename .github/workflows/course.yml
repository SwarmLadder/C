name: C17 curriculum and mastery labs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Compile all student and reference implementations
        run: make build/student build/reference build/mastery-student build/mastery-reference CC=${{ matrix.cc }} CFLAGS="-O1 -g -fsanitize=undefined -fno-omit-frame-pointer"
      - name: Validate 81 existing C workshop/project reference functions
        run: make reference CC=${{ matrix.cc }} CFLAGS="-O1 -g -fsanitize=undefined -fno-omit-frame-pointer"
      - name: Validate twelve C mastery labs
        run: make mastery-reference CC=${{ matrix.cc }} CFLAGS="-O1 -g -fsanitize=undefined -fno-omit-frame-pointer"
      - name: Validate course materials and links
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Confirm unfinished exercises fail grading
        shell: bash
        run: |
          if make check TASK=whole_minutes CC=${{ matrix.cc }} CFLAGS="-O1 -g -fsanitize=undefined"; then
            echo "Unfinished standard starter unexpectedly passed" >&2
            exit 1
          fi
          if make mastery-check TASK=checked_add CC=${{ matrix.cc }} CFLAGS="-O1 -g -fsanitize=undefined"; then
            echo "Unfinished mastery starter unexpectedly passed" >&2
            exit 1
          fi
